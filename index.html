      <h1>パンしりとり ― 漢字の二字熟語をつなぐ しりとりパズル</h1>
      <p>「上」→「手」→「紙」のように、となり合う2枚が二字熟語になるように漢字タイルを一列に並べる、小学生向けの学習パズルです。小学1年から中学までの学年別の漢字で遊べて、レベルが上がるとつなぐ枚数がふえます。生年月日から相棒のキャラクター（<a href="https://panuranai.ak-base.com" rel="noopener">パン占い</a>の「パンの申し子」）が決まります。</p>
